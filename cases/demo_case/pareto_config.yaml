# pareto_tac_emissions_config.yaml — ADN 产量 vs 再沸器能耗双目标 Pareto 优化配置
# 对应 Aspen 仿真文件：二级氢氰化工段.bkp
#
# 运行方式：
#   python -m src.main cases/demo_case/pareto_config.yaml
#   python -m src.main cases/demo_case/pareto_config.yaml --dry-run
#
# 优化目标：
#   ADN_FLOW   最大化 ADN 产品质量流量（kg/hr）—— 代表产量/吞吐量
#   REB_DUTY   最小化再沸器热负荷（kW）         —— 代表能耗/操作成本
#
# 为什么这两个目标存在真实权衡（而非原来的 TAC vs EMISSIONS）：
#   - B:F（塔底采出比）主要控制 ADN_FLOW：B:F 越高 -> 产量越高
#   - RR（回流比）主要控制 REB_DUTY：RR 越高 -> 能耗越高
#   - 在高 B:F 下要维持 ADN 纯度 >= 0.9，必须提高 RR -> 能耗上升
#   - 因此：高产量 <-> 高能耗，存在真实的 Pareto 权衡曲线
#
# 原 TAC vs EMISSIONS 配置的问题：
#   两者均由 REB_DUTY 单一驱动（Pearson r = 1.0），不构成真正的多目标权衡。
#
# 约束：
#   ADN 质量分数 >= 0.9（产品纯度下限）

# ---------------------------------------------------------------------------
# 仿真文件
# ---------------------------------------------------------------------------
simulator:
  filepath: cases/demo_case/二级氢氰化工段.bkp   # Aspen 仿真文件路径（.bkp/.apw），相对项目根目录
  visible: false               # 是否显示 Aspen GUI 窗口；false=后台静默运行（批量优化时更快更稳）
  suppress_dialogs: true       # 自动抑制 Aspen 弹窗（如收敛警告对话框），避免优化被阻塞
  require_type_library: true   # 强制加载 HAP 类型库，确保 block 状态检查可用
  timeout: 300                 # 单次仿真超时秒数；超过则判该工况失败，防止个别点卡死整轮优化
  reinit: true                 # 每次运行前 reinit 重置仿真状态，避免上一轮结果残留影响当前点
  verify_inputs: true          # 写入设计变量后回读校验，确认值已真正写进 Aspen（防静默写入失败）
  input_rtol: 1.0e-6           # 输入回读校验的相对容差；回读值与写入值偏差超过此比例则报错

# ---------------------------------------------------------------------------
# 设计变量
# ---------------------------------------------------------------------------
# 每个变量的通用字段说明：
#   name          变量标识名（日志、图表、数据库中显示用）
#   description   人类可读说明（仅注释用途，不参与计算）
#   aspen_path    该变量在 Aspen 变量树中的完整路径（写入点）
#   type          变量类型：
#                   continuous 连续变量，纳入贝叶斯优化搜索空间
#                   integer    整数变量，搜索时按连续处理、repair 阶段 round/clamp 取整
#                   fixed      固定变量，始终取 initial_value，不参与优化
#                   derived    派生变量，按比例映射到某个依赖路径（见 demo_case_2）
#   lower_bound   搜索下界（fixed 变量上下界相等）
#   upper_bound   搜索上界
#   initial_value 初始值（DOE 之前的基准点，也是 fixed 变量的取值）
#   unit          物理单位（"-" 表示无量纲）
design_variables:
  - name: T0301_BF
    description: T0301 塔底采出比（主要控制 ADN 产量）
    aspen_path: \Data\Blocks\T0301\Input\B:F
    type: continuous            # 连续变量，参与 BO 搜索
    lower_bound: 0.3
    upper_bound: 0.9
    initial_value: 0.6
    unit: "-"

  - name: T0301_FEED_STAGE
    description: T0301 进料板位置
    aspen_path: \Data\Blocks\T0301\Input\FEED_STAGE\0318
    type: integer               # 整数变量，repair 阶段 round/clamp 取整
    lower_bound: 10
    upper_bound: 20
    initial_value: 15
    unit: "-"

  - name: T0301_BASIS_RR
    description: T0301 回流比（主要控制分离效果和能耗）
    aspen_path: \Data\Blocks\T0301\Input\BASIS_RR
    type: continuous            # 连续变量，参与 BO 搜索
    lower_bound: 1.0
    upper_bound: 3.0
    initial_value: 2.0
    unit: "-"

# ---------------------------------------------------------------------------
# 输出节点（目标函数和约束函数从这里读取数值）
# ---------------------------------------------------------------------------
output_paths:
  - \Data\Streams\ADN\Output\MASSFRAC\MIXED\ADN    # 用于纯度约束
  - \Data\Streams\ADN\Output\MASSFLOW\MIXED\ADN    # 目标1：ADN 产量
  - \Data\Blocks\T0301\Output\REB_DUTY             # 目标2：再沸器热负荷

# ---------------------------------------------------------------------------
# 目标函数
# ---------------------------------------------------------------------------
# 字段说明：
#   name        目标名（图表/数据库列名）
#   type        目标取值方式：aspen_path 直接读 Aspen 节点；tac/emissions 由经济模型计算
#   aspen_path  type=aspen_path 时的读取节点路径
#   minimize    优化方向：true=最小化，false=最大化
#   unit        目标单位（仅展示用）
objectives:
  - name: ADN_FLOW
    type: aspen_path           # 直接读取 Aspen 输出节点的数值作为目标
    aspen_path: \Data\Streams\ADN\Output\MASSFLOW\MIXED\ADN
    minimize: false    # 最大化产量
    unit: "kg/hr"

  - name: REB_DUTY
    type: aspen_path           # 直接读取再沸器热负荷节点
    aspen_path: \Data\Blocks\T0301\Output\REB_DUTY
    minimize: true     # 最小化能耗（再沸器热负荷，kW）
    unit: "kW"

# ---------------------------------------------------------------------------
# 约束
# ---------------------------------------------------------------------------
# 字段说明：
#   name        约束名
#   description 人类可读说明
#   aspen_path  约束量的读取节点
#   operator    比较算子：>= / <= / > / < / ==
#   threshold   阈值；不满足 operator threshold 的工况标记为 infeasible（不可行）
constraints:
  - name: purity_min
    description: ADN 质量分数不低于 0.9（产品纯度下限）
    aspen_path: \Data\Streams\ADN\Output\MASSFRAC\MIXED\ADN
    operator: ">="
    threshold: 0.9

# ---------------------------------------------------------------------------
# block/stream 提取配置
# ---------------------------------------------------------------------------
# 控制每次仿真后从 Aspen 抓取哪些 block/stream 节点写入结果数据库。
extraction:
  check_status_paths:          # 仿真后检查这些 block/stream 的收敛状态，任一未收敛则判失败
    - \Data\Blocks\T0301
    - \Data\Streams\ADN
  blocks:                      # 需要提取 Output 子树的 block 列表
    - T0301
  streams:                     # 需要提取的 stream 列表
    - ADN
  block_max_depth: 3           # block 子树遍历最大深度（越深抓取越全，但越慢）
  stream_max_depth: 3          # stream 子树遍历最大深度
  stream_output_subtree: "Output\\STR_MAIN"   # stream 只提取此子树（主物流结果，跳过无关分支）
  strict_extraction: false     # false=节点级提取失败仅记 notes，不阻断目标计算；true=直接判失败
  mode: manifest               # 提取模式：manifest=按预建清单直接路径读取（快）；full=递归遍历
  catalog_db: cases/demo_case/output/node.db   # 节点目录/manifest 数据库路径
  manifest_id: auto            # 使用哪个 manifest；auto=自动选最新
  semantic_rules_dir: configs/aspen_semantics  # 语义标注规则目录（给节点附加业务含义）
  build_manifest_if_missing: true   # manifest 不存在时自动 catalog scan 并构建
  write_node_values: true      # 将本轮读取的节点值写入 node.db 的 node_values 表
  strict_manifest: true        # manifest 无效时阻止优化，避免把缺数据的工况当作有效样本

# ---------------------------------------------------------------------------
# 优化器（多目标 Pareto 贝叶斯优化）
# ---------------------------------------------------------------------------
optimizer:
  type: pareto_bayesian             # 优化类型：pareto_bayesian=多目标 Pareto；bayesian=单目标
  n_initial_points: 20              # 初始 DOE 采样点数（建模前的随机/LHS 探索）
  n_iterations: 60                  # 总仿真次数 = 20 + 60 = 80
  scalarization: chebyshev          # 对非凸 Pareto 前沿覆盖更均匀
  acquisition_function: EI          # 采集函数：EI=期望改善 / UCB / PI
  random_seed: 42                   # 全局随机种子，保证 DOE 与候选生成可复现

  # ML-assisted feasibility filtering（运行时生效）
  # 作用：用历史仿真数据库中的成功/失败标签训练可行性分类器，在 BO 阶段先生成候选池，
  #      再过滤掉预测不可行的候选点，以减少明显失败的 Aspen 调用。
  # 注意：第一次运行或历史样本不足时，分类器会自动跳过训练，优化仍按原流程执行。
  # 对照：若要做 baseline 对照实验，将 enabled 改为 false 后运行同一配置。
  feasibility_filter:
    enabled: true                 # 是否启用候选池可行性过滤；false=完全不使用分类器过滤
    model: extra_trees            # 分类器模型：extra_trees / random_forest / random
    min_samples: 20               # 训练分类器所需的最少历史样本数；不足时自动跳过过滤
    threshold: 0.40               # 可行概率阈值；越高越激进，越可能错杀可行点；demo 采用偏保守值
    candidate_pool_size: 200      # 每轮 BO 先生成的候选池大小，再从中筛选高可行概率点
    random_seed: 42               # 分类器随机种子，保证本地重复实验可复现

  # 自动早停与重复候选保护（任务 8 新增）
  # 作用：
  #   1. 当 Pareto front 或 hypervolume 连续多轮不再改善，自动停止优化，节省 Aspen 调用。
  #   2. 每轮选候选前检查是否已经运行过该点（fingerprint 去重），
  #      全部重复时跳过本轮而非强制重跑，避免污染数据库。
  #   3. min_iterations 保证在正式判断早停前已有足够探索。
  # 注意：
  #   - enabled=false 时完全不影响旧流程，所有 BO 轮次照常执行。
  #   - 早停不代表找到全局最优，只说明在当前搜索策略下继续改进概率较低。
  #   - 候选去重在 enabled=true 和 false 时都会生效（去重是保护机制，与早停无关）。
  early_stopping:
    enabled: true                    # 是否启用早停判断；false=跑满 n_iterations，去重仍生效
    min_iterations: 30               # 至少完成多少次总迭代后才允许触发早停
                                     # 设为 n_initial_points + 20，确保 BO 至少探索 20 轮再判断
    patience: 10                     # 连续多少轮无有效改善后停止；越大越宽松，允许更长停滞期
    min_delta: 1.0e-6                # hypervolume 改善量必须 > min_delta 才算有效改善；
                                     # 设置过大会导致过早停止，设置过小则收敛判断太松
    relative_delta: null             # 相对改善阈值（相对于当前最优值的比例）；null=不启用
                                     # 例如 1.0e-4 表示改善不足 0.01% 就算停滞
    max_duplicate_suggestions: 3     # 候选池连续几次全部重复后触发 no_unique_candidate 早停；
                                     # 通常是搜索空间探索完毕或 LHS 精度不足时触发
    check_hypervolume: true          # 多目标：是否用 hypervolume 改善作为早停判据
    check_first_front: true          # 多目标：是否检查 Pareto 第一前沿的变化作为早停判据
                                     # 两个检查都不改善才累计 no_improvement_count

# ---------------------------------------------------------------------------
# 离线可行性评估配置（人工运行前使用；当前优化器不会自动读取）
# ---------------------------------------------------------------------------
# 作用：用历史 simulation.db 评估 feasibility_filter 是否可靠。
# 典型流程：
#   1. 从 cases/demo_case/output/simulation.db 导出 feasibility dataset
#   2. 用下列参数运行 evaluate_feasibility_from_db(...)
#   3. 将评估结果交给 feasibility_gate 判断是否建议开启上面的 feasibility_filter
feasibility_evaluation:
  test_size: 0.25                 # 历史样本中用于测试集的比例
  random_seed: 42                 # 训练/测试划分和分类器训练随机种子
  threshold: 0.40                 # 与 optimizer.feasibility_filter.threshold 保持一致
  min_samples: 20                 # 评估所需最少样本数；不足则不应相信分类器
  model: extra_trees              # 与 optimizer.feasibility_filter.model 保持一致

# ---------------------------------------------------------------------------
# 可行性过滤器质量门控（人工运行前使用；当前优化器不会自动强制执行）
# ---------------------------------------------------------------------------
# 作用：根据离线评估结果决定是否建议启用 feasibility_filter。
# 核心风险是 false negative：实际可行的 Aspen 工况被分类器误判为不可行并提前丢弃。
feasibility_gate:
  enabled: true                   # 是否启用门控判断；false=门控不阻止使用过滤器
  min_samples: 20                 # 门控要求的最少评估样本数
  min_recall: 0.85                # 最低召回率；召回率低表示可行点被错杀较多
  max_false_negative_rate: 0.10   # FN / (FN + TP) 上限；超过则不建议启用过滤器
  max_false_negative_count: 1     # 可接受的 false negative 绝对数量上限；null=不限制
  min_precision: null             # 可选：最低精度要求；null=不检查，因 FP 主要浪费仿真而非错杀好点
  min_f1: null                    # 可选：最低 F1 要求；null=不检查
  require_no_warnings: false      # true=评估结果有任何 warning 都拒绝启用
  allow_single_class: false       # false=只有成功或只有失败样本时拒绝启用分类器
