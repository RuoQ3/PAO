# pareto_config.yaml — 三塔萃取精馏工艺 CAPEX vs OPEX 双目标 Pareto 优化配置
# 对应 Aspen 仿真文件：2epsd.bkp
# 原始参考：Fun_Objective.m / Opt_simulationColumn.m（NSGA-II 多目标优化）
#
# 运行方式：
#   python -m src.main cases/demo_case_2/pareto_config.yaml
#   python -m src.main cases/demo_case_2/pareto_config.yaml --dry-run
#
# 工艺描述：
#   三塔萃取精馏系统，分离 PROH（1-丙醇）、BUAC（乙酸丁酯）、WATER 三种产品。
#   T1 → 塔顶产品 D1（PROH），T2 → 塔顶产品 D2（BUAC），T3 → 塔顶产品 D3（WATER）。
#   S1、S2 为萃取剂进料流股。
#
# 优化目标（对应原 MATLAB 的 CAPEX vs OPEX）：
#   TAC        最小化总年化成本（$/yr）—— 资本成本 + 操作成本
#   EMISSIONS  最小化 CO₂-eq 排放量（tonne CO₂-eq/yr）—— 公用工程间接排放
#
# 为什么这两个目标存在真实权衡：
#   - 回流比（RR）越高 → 分离效果越好，但再沸器/冷凝器负荷越大 → OPEX/EMISSIONS 上升
#   - 塔压（P）越高 → 相对挥发度变化，影响分离难度和公用工程消耗
#   - 萃取剂流量（SOL）越大 → 分离效果越好，但泵功耗和热负荷增加
#   - 因此：高纯度/高回收率 <-> 高能耗/高排放，存在真实的 Pareto 权衡曲线
#
# 约束（对应原 MATLAB 的纯度约束）：
#   D1 中 PF 摩尔分率 >= 0.999   （Aspen 内部组分名 PF，MATLAB 注释称 PROH/1-丙醇）
#   D2 中 NPA 摩尔分率 >= 0.999  （Aspen 内部组分名 NPA，MATLAB 注释称 BUAC/乙酸丁酯）
#   D3 中 WATER 摩尔分率 >= 0.999
#
# 设计变量策略：NSTAGE + 主进料板比例 derived 映射，S1/S2 保留整数约束：
#   连续搜索变量（9 个）：各塔回流比（RR）、各塔操作压力（P）、主进料板 frac × 3
#   整数变量（5 个）：NSTAGE × 3 + S1/S2 FEED_STAGE × 2（skopt.Integer 搜索）
#   固定变量（2 个）：萃取剂流量（SOL × 2）
#   总搜索维度：14 维（9 连续/derived + 5 整数）
#   derived：F1/F2/F3 用 frac → FEED_STAGE 映射，避免贴底板/越界采样；
#   var_dependencies：S1/S2 两条 lt 约束保证 FEED_STAGE < NSTAGE。
#
# 注意：本工艺为真空操作系统，各塔操作压力均在 0.06~0.18 atm 范围内。
#   初始值和搜索范围均基于 .bkp 文件中的原始收敛解：
#   T1: NSTAGE=50, RR=0.832, FEED_F1=28, FEED_S1=3, P=0.0576 atm
#   T2: NSTAGE=118, RR=0.230, FEED_F2=108, FEED_S2=7, P=0.183 atm
#   T3: NSTAGE=14, RR=1.769, FEED_F3=6, P=0.0598 atm
#   S1=69 kmol/hr, S2=231 kmol/hr

# ---------------------------------------------------------------------------
# 仿真文件
# ---------------------------------------------------------------------------
simulator:
  filepath: cases/demo_case_2/2epsd.bkp
  visible: false
  suppress_dialogs: true
  require_type_library: true   # 强制加载 HAP 类型库，确保 block 状态检查可用
  timeout: 300
  reinit: true
  verify_inputs: true
  input_rtol: 1.0e-6

# ---------------------------------------------------------------------------
# 设计变量
# ---------------------------------------------------------------------------
# 连续变量（参与贝叶斯优化）：9 个（6 个常规连续变量 + 3 个 derived frac）
# 整数变量（参与贝叶斯优化，skopt.Integer）：5 个（NSTAGE × 3 + S1/S2 FEED_STAGE × 2）
# 固定变量（不参与优化）：2 个（SOL × 2）
# 总搜索维度：14 维（9 连续/derived + 5 整数）
# F1/F2/F3 使用 derived frac 映射；S1/S2 使用 var_dependencies 保证 FEED_STAGE < NSTAGE
design_variables:

  # ── T1 塔 ──────────────────────────────────────────────────────────────
  - name: T1_RR
    description: T1 塔回流比（原始值=0.832，低回流比萃取精馏）
    aspen_path: \Data\Blocks\T1\Input\BASIS_RR
    type: continuous
    lower_bound: 0.1
    upper_bound: 3.0
    initial_value: 0.832
    unit: "-"

  - name: T1_NSTAGE
    description: T1 理论板数（原始值=50，整数优化；范围基于原始值 ±40%）
    aspen_path: \Data\Blocks\T1\Input\NSTAGE
    type: integer
    lower_bound: 30
    upper_bound: 70
    initial_value: 50
    unit: "-"

  - name: T1_FEED_F1_FRAC
    description: T1 主进料 F1 比例进料板位置，运行前映射为 FEED_STAGE\F1
    type: derived
    lo_frac: 0.35
    hi_frac: 0.85
    target_path: \Data\Blocks\T1\Input\FEED_STAGE\F1
    depends_on: \Data\Blocks\T1\Input\NSTAGE
    frac_lo: 5
    unit: "-"

  - name: T1_FEED_S1
    description: T1 萃取剂 S1 进料板位置（原始值=3；靠近塔顶，上界保守取 15）
    aspen_path: \Data\Blocks\T1\Input\FEED_STAGE\S1
    type: integer
    lower_bound: 2
    upper_bound: 15
    initial_value: 3
    unit: "-"

  - name: T1_PRES
    description: T1 塔顶操作压力（真空操作；原始值=0.0576 atm）
    aspen_path: \Data\Blocks\T1\Input\PRES1
    type: continuous
    lower_bound: 0.01
    upper_bound: 0.5
    initial_value: 0.0576
    unit: "atm"

  # ── T2 塔 ──────────────────────────────────────────────────────────────
  - name: T2_RR
    description: T2 塔回流比（原始值=0.230，极低回流比）
    aspen_path: \Data\Blocks\T2\Input\BASIS_RR
    type: continuous
    lower_bound: 0.05
    upper_bound: 2.0
    initial_value: 0.230
    unit: "-"

  - name: T2_NSTAGE
    description: T2 理论板数（原始值=118，整数优化；范围基于原始值 ±32%）
    aspen_path: \Data\Blocks\T2\Input\NSTAGE
    type: integer
    lower_bound: 80
    upper_bound: 150
    initial_value: 118
    unit: "-"

  - name: T2_FEED_F2_FRAC
    description: T2 主进料 F2 比例进料板位置，运行前映射为 FEED_STAGE\F2
    type: derived
    lo_frac: 0.65
    hi_frac: 0.92
    target_path: \Data\Blocks\T2\Input\FEED_STAGE\F2
    depends_on: \Data\Blocks\T2\Input\NSTAGE
    frac_lo: 10
    unit: "-"

  - name: T2_FEED_S2
    description: T2 萃取剂 S2 进料板位置（原始值=7；靠近塔顶，上界保守取 20）
    aspen_path: \Data\Blocks\T2\Input\FEED_STAGE\S2
    type: integer
    lower_bound: 3
    upper_bound: 20
    initial_value: 7
    unit: "-"

  - name: T2_PRES
    description: T2 塔顶操作压力（真空操作；原始值=0.183 atm）
    aspen_path: \Data\Blocks\T2\Input\PRES1
    type: continuous
    lower_bound: 0.05
    upper_bound: 1.0
    initial_value: 0.183
    unit: "atm"

  # ── T3 塔 ──────────────────────────────────────────────────────────────
  - name: T3_RR
    description: T3 塔回流比（原始值=1.769）
    aspen_path: \Data\Blocks\T3\Input\BASIS_RR
    type: continuous
    lower_bound: 0.5
    upper_bound: 5.0
    initial_value: 1.769
    unit: "-"

  - name: T3_NSTAGE
    description: T3 理论板数（原始值=14，整数优化；范围基于原始值 ±57%）
    aspen_path: \Data\Blocks\T3\Input\NSTAGE
    type: integer
    lower_bound: 8
    upper_bound: 22
    initial_value: 14
    unit: "-"

  - name: T3_FEED_F3_FRAC
    description: T3 主进料 F3 比例进料板位置，运行前映射为 FEED_STAGE\F3
    type: derived
    lo_frac: 0.25
    hi_frac: 0.80
    target_path: \Data\Blocks\T3\Input\FEED_STAGE\F3
    depends_on: \Data\Blocks\T3\Input\NSTAGE
    frac_lo: 3
    unit: "-"

  - name: T3_PRES
    description: T3 塔顶操作压力（真空操作；原始值=0.0598 atm）
    aspen_path: \Data\Blocks\T3\Input\PRES1
    type: continuous
    lower_bound: 0.01
    upper_bound: 0.5
    initial_value: 0.0598
    unit: "atm"

  # ── 萃取剂流量 ──────────────────────────────────────────────────────────
  - name: SOL1_FLOW
    description: 萃取剂 S1 总摩尔流量（固定为原始值=69 kmol/hr，暂不优化）
    aspen_path: \Data\Streams\S1\Input\TOTFLOW\MIXED
    type: fixed
    lower_bound: 69
    upper_bound: 69
    initial_value: 69
    unit: "kmol/hr"

  - name: SOL2_FLOW
    description: 萃取剂 S2 总摩尔流量（固定为原始值=231 kmol/hr，暂不优化）
    aspen_path: \Data\Streams\S2\Input\TOTFLOW\MIXED
    type: fixed
    lower_bound: 231
    upper_bound: 231
    initial_value: 231
    unit: "kmol/hr"

# ---------------------------------------------------------------------------
# 输出节点（约束函数从这里读取数值）
# ---------------------------------------------------------------------------
output_paths:
  - \Data\Streams\D1\Output\MOLEFRAC\MIXED\PF      # 约束1：D1 中 PF 摩尔分率（MATLAB 称 PROH）
  - \Data\Streams\D2\Output\MOLEFRAC\MIXED\NPA     # 约束2：D2 中 NPA 摩尔分率（MATLAB 称 BUAC）
  - \Data\Streams\D3\Output\MOLEFRAC\MIXED\WATER   # 约束3：D3 中 WATER 摩尔分率

# ---------------------------------------------------------------------------
# 目标函数（对应原 MATLAB 的 CAPEX vs OPEX）
# ---------------------------------------------------------------------------
objectives:
  - name: TAC
    type: tac
    minimize: true
    unit: "$/yr"
    annualization_factor: 0.1        # 10 年直线折旧
    operating_hours: 8000.0          # 年操作小时数
    skip_missing: false              # 任一设备缺数据则 TAC=None，不低估成本
    allow_partial_objective: false
    utility_cost:
      steam_price: 14.19             # $/GJ，低压蒸汽（Turton 2018）
      cooling_water_price: 0.354     # $/GJ
      electricity_price: 0.0775      # $/kWh
    equipment_params:
      cepci_current: 800.0           # 当前 CEPCI 估算值
    # NSTAGE 在 Input 子树，需要 fallback 设计参数
    # DIAM 节点（Output\DIAM）值=0 且单位为空，无效；
    # 实际塔径在 Output\CA_DIAM6（单位 meter），通过 output_key_map 重定向
    output_key_map:
      RADFRAC:
        diam: CA_DIAM6               # 重定向到 Column Internals 计算的实际塔径
    block_design_params:
      T1:
        nstage: 50                   # fallback 值；NSTAGE 为整数优化变量，实际值由每轮仿真决定
      T2:
        nstage: 118                  # fallback 值；同上
      T3:
        nstage: 14                   # fallback 值；同上
    # fallback_design：当 Aspen sizing 数据不可用时使用的保守塔径估算值。
    # 注意：这不是 Aspen 严格 sizing 结果，仅用于让 TAC/EMISSIONS 优化闭环先跑通。
    # 后续正式经济分析时应替换为 Aspen sizing 输出或设备尺寸推导模块。
    # 实际用于 TAC 计算的塔径 = diameter × conservative_factor。
    fallback_design:
      source: yaml_fallback
      conservative_factor: 1.2       # 保守系数，补偿估算不确定性
      column_diameter:
        T1: 1.2                      # m，基于原始收敛解的工程估算
        T2: 1.5                      # m
        T3: 0.8                      # m

  - name: EMISSIONS
    type: emissions
    minimize: true
    unit: "tonne CO2-eq/yr"
    operating_hours: 8000.0
    skip_missing: false
    allow_partial_objective: false
    emission_factors:
      steam_factor: 66.0             # kg CO₂/GJ，天然气锅炉 η=0.85
      cooling_water_factor: 0.0      # 冷却水排放可忽略
      electricity_factor: 0.581      # kg CO₂/kWh，中国电网 2023
    ghg_components:
      CO2: 1.0
      CH4: 27.9
      N2O: 273.0
    vent_streams: []                 # 本工艺无直接排放流股（Scope 1 = 0）

# ---------------------------------------------------------------------------
# 约束（对应原 MATLAB 的纯度约束 >= 0.999 mol frac）
# ---------------------------------------------------------------------------
constraints:
  - name: D1_PF_purity
    description: D1 塔顶产品 PF 摩尔分率不低于 0.999（Aspen 组分名 PF，对应 MATLAB 中的 PROH）
    aspen_path: \Data\Streams\D1\Output\MOLEFRAC\MIXED\PF
    operator: ">="
    threshold: 0.9

  - name: D2_NPA_purity
    description: D2 塔顶产品 NPA 摩尔分率不低于 0.999（Aspen 组分名 NPA，对应 MATLAB 中的 BUAC）
    aspen_path: \Data\Streams\D2\Output\MOLEFRAC\MIXED\NPA
    operator: ">="
    threshold: 0.9

  - name: D3_WATER_purity
    description: D3 塔顶产品 WATER 摩尔分率不低于 0.999
    aspen_path: \Data\Streams\D3\Output\MOLEFRAC\MIXED\WATER
    operator: ">="
    threshold: 0.9

# ---------------------------------------------------------------------------
# block/stream 提取配置
# ---------------------------------------------------------------------------
extraction:
  # 只检查三个精馏塔和三个产品流股的收敛状态
  check_status_paths:
    - \Data\Blocks\T1
    - \Data\Blocks\T2
    - \Data\Blocks\T3
    - \Data\Streams\D1
    - \Data\Streams\D2
    - \Data\Streams\D3
  # 提取三个精馏塔的 Output 子树
  # 注意：T2 有 118 块板，Output 子树极大（含 Column Internals 深层节点）
  # block_max_depth=2 只取一级子节点（REB_DUTY、COND_DUTY、CA_DIAM6 等），
  # 避免遍历 CA_ACT_AREA\INT-1\CS-1 等深层节点导致每次提取耗时 3 分钟
  blocks:
    - T1
    - T2
    - T3
  # 提取三个产品流股（用于约束验证和结果分析）
  streams:
    - D1
    - D2
    - D3
  block_max_depth: 2                 # 从 3 降为 2，避免遍历 Column Internals 深层节点
  stream_max_depth: 3
  stream_output_subtree: "Output\\STR_MAIN"
  strict_extraction: false           # 节点级失败记录到 notes，不阻断目标计算

  # ── manifest runtime 模式（可选，启用后替代递归 TreeExporter）──────────────
  # 启用方式：将 mode 改为 manifest，首次运行会自动 catalog scan + build manifest
  # 优势：直接路径读取，COM 访问次数最小化，解决 CA_DIAM* 深层节点截断问题
  mode: manifest
  catalog_db: cases/demo_case_2/output/node.db
  manifest_id: auto                  # auto=自动查找最新 manifest；或指定具体 ID
  semantic_rules_dir: configs/aspen_semantics
  build_manifest_if_missing: true    # 首次运行自动 catalog scan + build manifest
  write_node_values: true            # 将读取结果写入 node.db node_values 表
  strict_manifest: true              # manifest invalid 时阻止优化（不把缺数据当有效样本）

# ---------------------------------------------------------------------------
# 优化器（多目标 Pareto 贝叶斯优化）
# ---------------------------------------------------------------------------
optimizer:
  type: pareto_bayesian
  n_initial_points: 42              # 14 维（6 连续 + 8 整数），建议初始 DOE >= 3 倍维度
  n_iterations: 150                 # 14 维混合整数空间，需要更多样本
  surrogate_model: RF               # RF 对混合整数、非线性响应面更稳健

  # GP：Gaussian Process，高斯过程。默认值，适合低维、较平滑目标。
  # RF：Random Forest，随机森林。更适合非线性、不连续、混合整数变量。
  # ET：Extra Trees，极端随机树。和 RF 类似，随机性更强，常适合粗糙响应面。
  # GBRT：Gradient Boosted Regression Trees，梯度提升树。适合有一定非线性结构的数据，但小样本时可能不稳定。
  # RANDOM：纯随机采样，不用代理模型，不依赖 skopt。

  scalarization: chebyshev          # Chebyshev 标量化对非凸 Pareto 前沿覆盖更均匀
  acquisition_function: EI          # Expected Improvement
  random_seed: 42
  n_initial_min: 5                  # 启用代理模型所需的最少成功样本数
  hv_margin: 0.1                    # 自动推断参考点时各维度扩展 10%

  # ML-assisted feasibility filtering（运行时生效）
  # 作用：用历史 Aspen 仿真数据库中的成功/失败样本训练可行性分类器。
  #      对 14 维混合整数搜索空间，先生成较大的候选池，再过滤预测不可行的点，
  #      以减少明显失败的仿真调用。
  # 注意：历史样本不足时会自动跳过训练，不阻塞优化。
  # 对照：若要做 baseline 对照实验，将 enabled 改为 false 后运行同一配置。
  feasibility_filter:
    enabled: true                 # 是否启用候选池可行性过滤；false=完全不使用分类器过滤
    model: extra_trees            # 分类器模型：extra_trees / random_forest / random
    min_samples: 40               # 训练分类器所需的最少历史样本数；高维 case 需要更多样本
    threshold: 0.35               # 可行概率阈值；高维早期数据稀疏，先用保守阈值降低错杀风险
    candidate_pool_size: 400      # 每轮 BO 先生成的候选池大小；高维空间使用更大候选池
    random_seed: 42               # 分类器随机种子，保证本地重复实验可复现

  # 自动早停与重复候选保护（任务 8 新增）
  # 背景：demo_case_2 曾出现 feasibility_filter 每轮选中同一候选（索引 324）并反复调用
  #      Aspen 的问题。本配置同时解决三个问题：
  #   1. 候选去重：每轮 BO 运行前检查 fingerprint，重复候选直接跳过，绝不重跑 Aspen。
  #   2. 自动早停：Pareto front / HV 连续停滞时主动停止，节省后续无效仿真。
  #   3. 迭代 seed：每轮候选池使用不同随机数，避免固定种子导致每轮选到同一候选。
  # 注意：
  #   - enabled=false 时只有候选去重生效（去重是保护机制，始终开启）；不做早停判断。
  #   - 早停不等于找到全局最优，只说明当前搜索策略下进一步改进概率较低。
  #   - duplicate_skipped_iterations 和 no_unique_candidate_count 会记录在 to_summary() 中。
  early_stopping:
    enabled: true                    # 是否启用早停判断；false=跑满 n_iterations
    min_iterations: 60               # 至少完成多少次总迭代（含 DOE）后才允许触发早停
                                     # 14 维高维空间，设为 n_initial_points(42) + 约 38 轮 BO
                                     # 保证代理模型已有足够拟合数据再进行停滞判断
    patience: 12                     # 连续多少轮无有效改善后停止
                                     # 高维空间改善较慢，patience 设大一些避免过早停止
    min_delta: 1.0e-6                # hypervolume 改善量下限；小于此值视为停滞
                                     # 对于 TAC/EMISSIONS 量级，此值足够区分真实改善和数值噪声
    relative_delta: 1.0e-4           # 相对改善阈值：HV 改善比例 < 0.01% 视为停滞
                                     # 配合 min_delta 双重判断，避免大值 HV 下绝对改善掩盖停滞
    max_duplicate_suggestions: 3     # 候选池连续几次全部重复后触发 no_unique_candidate 早停
                                     # 每次重试都会变换 seed，3 次仍找不到新点则确实耗尽
    check_hypervolume: true          # 多目标：是否用 hypervolume 改善作为早停判据
                                     # 高维混合整数空间中 HV 是最综合的进度指标
    check_first_front: true          # 多目标：是否检查 Pareto 第一前沿变化作为辅助判据
                                     # HV 和 front 都没有改善才累计 no_improvement_count

# ---------------------------------------------------------------------------
# 离线可行性评估配置（人工运行前使用；当前优化器不会自动读取）
# ---------------------------------------------------------------------------
# 作用：用历史 simulation.db 评估 feasibility_filter 是否可靠。
# 典型流程：
#   1. 从 cases/demo_case_2/output/simulation.db 导出 feasibility dataset
#   2. 用下列参数运行 evaluate_feasibility_from_db(...)
#   3. 将评估结果交给 feasibility_gate 判断是否建议开启上面的 feasibility_filter
feasibility_evaluation:
  test_size: 0.25                 # 历史样本中用于测试集的比例
  random_seed: 42                 # 训练/测试划分和分类器训练随机种子
  threshold: 0.35                 # 与 optimizer.feasibility_filter.threshold 保持一致
  min_samples: 40                 # 评估所需最少样本数；不足则不应相信分类器
  model: extra_trees              # 与 optimizer.feasibility_filter.model 保持一致

# ---------------------------------------------------------------------------
# 可行性过滤器质量门控（人工运行前使用；当前优化器不会自动强制执行）
# ---------------------------------------------------------------------------
# 作用：根据离线评估结果决定是否建议启用 feasibility_filter。
# 核心风险是 false negative：实际可行的 Aspen 工况被分类器误判为不可行并提前丢弃。
feasibility_gate:
  enabled: true                   # 是否启用门控判断；false=门控不阻止使用过滤器
  min_samples: 40                 # 门控要求的最少评估样本数；与高维过滤器训练门槛一致
  min_recall: 0.90                # 最低召回率；高维昂贵仿真中更强调不要错杀可行点
  max_false_negative_rate: 0.08   # FN / (FN + TP) 上限；比 demo_case 更严格
  max_false_negative_count: 2     # 可接受的 false negative 绝对数量上限；null=不限制
  min_precision: null             # 可选：最低精度要求；null=不检查，因 FP 主要浪费仿真而非错杀好点
  min_f1: null                    # 可选：最低 F1 要求；null=不检查
  require_no_warnings: false      # true=评估结果有任何 warning 都拒绝启用
  allow_single_class: false       # false=只有成功或只有失败样本时拒绝启用分类器

# ---------------------------------------------------------------------------
# 变量依赖约束
# S1/S2 为整数优化变量，必须满足 < 对应塔的 NSTAGE。
# F1/F2/F3 已由 derived frac 映射保证合法，不再放入 var_dependencies。
# ---------------------------------------------------------------------------
var_dependencies:
  \Data\Blocks\T1\Input\FEED_STAGE\S1:
    lt: \Data\Blocks\T1\Input\NSTAGE
  \Data\Blocks\T2\Input\FEED_STAGE\S2:
    lt: \Data\Blocks\T2\Input\NSTAGE

# ---------------------------------------------------------------------------
# Phase 0 可行性搜索（在 Phase 1 DOE 之前先找可行点）
# ---------------------------------------------------------------------------
feasibility_search:
  enabled: true
  n_trials: 30                      # 混合整数空间失败率更高，从 10 → 30
  stop_after_feasible: 3            # 找到 3 个可行点后提前停止
