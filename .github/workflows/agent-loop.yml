name: Agent loop tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML numpy scikit-optimize python-dotenv langgraph langchain-core
      - run: python -m pytest -q
