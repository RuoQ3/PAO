- aspen_path: \Data\Blocks\T0301\Output\REB_DUTY
  minimize: true
  name: REB_DUTY
  type: aspen_path
  unit: ''
optimizer:
  acquisition_function: EI
  early_stopping:
    check_first_front: true
    check_hypervolume: true
    enabled: true
    max_duplicate_suggestions: 3
    min_delta: 1.0e-06
    min_iterations: 30
    patience: 10
    relative_delta: null
  feasibility_filter:
    candidate_pool_size: 200
    enabled: false
    min_samples: 20
    model: extra_trees
    random_seed: 42
    threshold: 0.4
  n_initial_points: 10
  n_iterations: 20
  random_seed: 42
  scalarization: chebyshev
  type: pareto_bayesian
output_paths:
- \Data\Streams\ADN\Output\MASSFLOW\MIXED\ADN
- \Data\Blocks\T0301\Output\REB_DUTY
