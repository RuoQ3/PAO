# radfrac.yaml — RADFRAC 精馏塔语义规则
#
# 格式说明
# --------
# equipment_type: Aspen HAP_RECORDTYPE 字符串，与 catalog 中 block_type 匹配。
#
# fields.<field_name>:
#   required_for: 触发此字段读取的目标函数名称列表（TAC/EMISSIONS/ENERGY）。
#                 空列表 [] 表示始终读取（如 nstage）。
#   required: true 表示缺失时 manifest 标记 invalid；false 表示 optional。
#   candidates: 候选路径规则列表，按 priority 降序尝试匹配。
#     pattern: 相对于 block 根节点（\Data\Blocks\<name>）的路径模式。
#              支持 glob 通配符（* 匹配单段，** 匹配多段）。
#              路径分隔符使用反斜杠 \。
#     priority: 匹配优先级，数值越大越优先（0-100）。
#   validators:
#     value_type: numeric（1=INTEGER 或 2=REAL）/ string / any
#     unit_dimension: energy_rate / length / dimensionless / area / power / any
#                     "" 或 any 表示不校验单位维度。
#
# 注意
# ----
# - 不要在此文件中硬编码 block 名称（T1/T2/T3 等）。
# - pattern 中的 * 只匹配单个路径段（不含 \）。
# - 路径大小写不敏感（Aspen 树路径通常全大写）。

equipment_type: RADFRAC

fields:

  reboiler_duty:
    required_for: [TAC, EMISSIONS, ENERGY]
    required: true
    candidates:
      - pattern: "Output\\REB_DUTY"
        priority: 100
      - pattern: "Output\\QREB"
        priority: 90
      - pattern: "Output\\QREB*"
        priority: 80
      - pattern: "Output\\COND_DUTY2"
        priority: 10
    validators:
      value_type: numeric
      unit_dimension: energy_rate

  condenser_duty:
    required_for: [TAC, EMISSIONS, ENERGY]
    required: true
    candidates:
      - pattern: "Output\\COND_DUTY"
        priority: 100
      - pattern: "Output\\QCOND"
        priority: 90
      - pattern: "Output\\QCOND*"
        priority: 80
    validators:
      value_type: numeric
      unit_dimension: energy_rate

  column_diameter:
    required_for: [TAC]
    required: false          # TAC 层有 fallback_design 兜底，manifest 不强制要求
    candidates:
      - pattern: "Output\\DIAM_STAGE"
        priority: 100
      - pattern: "Output\\CA_DIAM*"
        priority: 90          # Column Internals 计算的实际塔径，unit=meter，sample_value>0
      - pattern: "Output\\DIAM"
        priority: 50          # 通常 unit="" sample_value=0（未做 sizing），降低优先级
      - pattern: "Output\\DIAM*"
        priority: 40
    validators:
      value_type: numeric
      unit_dimension: length
      sample_value_nonzero: true   # 排除 sample_value=0 或 None 的节点

  nstage:
    required_for: [TAC]
    required: false          # TAC 层有 block_design_params fallback，manifest 不强制要求
    candidates:
      - pattern: "Input\\NSTAGE"
        priority: 100
      - pattern: "Output\\NSTAGE"
        priority: 60
    validators:
      value_type: numeric
      unit_dimension: dimensionless

  reflux_ratio:
    required_for: []
    required: false
    candidates:
      - pattern: "Output\\RR"
        priority: 100
      - pattern: "Output\\MOLE_RR"
        priority: 90
      - pattern: "Input\\RR"
        priority: 70
    validators:
      value_type: numeric
      unit_dimension: dimensionless

  distillate_rate:
    required_for: []
    required: false
    candidates:
      - pattern: "Output\\MOLE_D"
        priority: 100
      - pattern: "Output\\MASS_D"
        priority: 80
    validators:
      value_type: numeric
      unit_dimension: any

  bottoms_rate:
    required_for: []
    required: false
    candidates:
      - pattern: "Output\\MOLE_B"
        priority: 100
      - pattern: "Output\\MASS_B"
        priority: 80
    validators:
      value_type: numeric
      unit_dimension: any

  condenser_temperature:
    required_for: [ENERGY]
    required: false
    candidates:
      - pattern: "Output\\TEMP_COND"
        priority: 100
      - pattern: "Output\\B_TEMP\\1"
        priority: 70
    validators:
      value_type: numeric
      unit_dimension: temperature

  reboiler_temperature:
    required_for: [ENERGY]
    required: false
    candidates:
      - pattern: "Output\\TEMP_REB"
        priority: 100
    validators:
      value_type: numeric
      unit_dimension: temperature

  column_pressure:
    required_for: []
    required: false
    candidates:
      - pattern: "Input\\PRES1"
        priority: 100
      - pattern: "Output\\B_PRES\\1"
        priority: 80
    validators:
      value_type: numeric
      unit_dimension: pressure

  # ---- 补充可调输入字段（A2-5c 验收要求）-------------------------------
  # 以下字段供 discover_tunables 使用；
  # 额外字段 tunable/suggested_*/confidence 由 A3 读取，manifest.py 忽略。

  basis_reflux_ratio:
    required_for: []
    required: false
    tunable: true
    suggested_lower: 1.0       # 无量纲，最小回流比（通常 > 最小回流比）
    suggested_upper: 5.0       # 无量纲，上限（过高能耗极大）
    confidence: medium         # 经验范围，精馏系统差异较大，建议用户确认
    candidates:
      - pattern: "Input\\BASIS_RR"
        priority: 100          # 精馏塔基准回流比（Aspen RADFRAC 主要设计规格）
      - pattern: "Input\\BASIS_RR*"
        priority: 90
    validators:
      value_type: numeric
      unit_dimension: dimensionless

  bottoms_to_feed_ratio:
    required_for: []
    required: false
    tunable: true
    suggested_lower: 0.1       # 无量纲，极小塔底采出比（几乎不采出）
    suggested_upper: 0.95      # 无量纲，极大塔底采出比（塔顶几乎无出料）
    confidence: medium         # 由质量平衡约束，实际范围还受纯度约束限制
    candidates:
      - pattern: "Input\\B:F"
        priority: 100          # 塔底采出比（Bottoms:Feed ratio），Aspen 路径含冒号
      - pattern: "Input\\BF*"
        priority: 70           # 少数版本可能使用不同命名
    validators:
      value_type: numeric
      unit_dimension: dimensionless

  feed_stage:
    required_for: []
    required: false
    tunable: true
    suggested_lower: null      # 进料板下界依赖塔板总数（建议 = nstage * 0.3，由 A4 推算）
    suggested_upper: null      # 进料板上界依赖塔板总数（建议 = nstage * 0.7）
    confidence: medium         # 规则命中，但边界需结合 nstage 推算
    candidates:
      - pattern: "Input\\FEED_STAGE\\*"
        priority: 100          # * 匹配进料流股名称（如 0318、FEED 等）
      - pattern: "Input\\FEED_STAGE*"
        priority: 80           # 兜底，匹配无流股名的简化路径
    validators:
      value_type: numeric
      unit_dimension: dimensionless
